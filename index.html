<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Learn Python, SQL, and machine learning with short lessons and interactive quizzes.">
<title>EduSphere AI | Study workspace</title>
<style>
:root{color-scheme:dark;--bg:#101416;--panel:#191f20;--line:#323c3b;--text:#eef4ed;--muted:#afbfba;--accent:#cefa89;--ink:#192512}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}
header>div,main{max-width:1100px;margin:auto;padding:20px clamp(16px,4vw,40px)}
header>div{display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.03em}
.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--accent);color:var(--ink);border-radius:10px}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 14px;background:var(--panel);color:var(--text)}
button:hover,button[aria-pressed=true]{border-color:var(--accent)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary{background:var(--accent);color:var(--ink);font-weight:700;border-color:var(--accent)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.07em;line-height:1.06;margin-bottom:12px}
h2{font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.04em;line-height:1.15}
h3{margin-bottom:8px}
.intro{padding:32px 0 16px}
.muted,small{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:20px}
.panel{padding:clamp(16px,3vw,28px);border:1px solid var(--line);border-radius:18px;background:var(--panel);min-width:0}
aside .panel+ .panel{margin-top:18px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border-radius:8px;color:var(--accent)}
fieldset{border:0;margin:22px 0 0;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:10px}
.choice{display:flex;align-items:baseline;gap:8px;padding:8px 0}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);margin:6px 0 10px}
progress{width:100%;accent-color:var(--accent)}
.feedback{margin:8px 0 0;color:var(--accent)}
.saved-list{display:grid;gap:10px}
.saved-list button{text-align:left}
[hidden]{display:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}header>div{flex-wrap:wrap}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<header><div><div class="brand"><span class="mark" aria-hidden="true">E</span> EduSphere AI</div><nav aria-label="Workspace"><button id="study-view" aria-pressed="true">Study</button><button id="saved-view" aria-pressed="false">Saved</button></nav></div></header>
<main>
<section class="intro"><h1>Build your data skills</h1><p class="muted">Learn Python, SQL, and machine learning one short lesson at a time.</p></section>
<section id="account" class="panel" aria-labelledby="account-title" hidden>
<h3 id="account-title">Study account</h3>
<form id="account-form">
<label for="username">Username</label>
<input id="username" type="text" required minlength="3" maxlength="30" autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password">
<div class="actions"><button id="sign-in" type="submit">Sign in</button><button id="register" type="submit">Create account</button></div>
</form>
<button id="sign-out" hidden>Sign out</button>
<button id="retry-sync" hidden>Retry sync</button>
<p id="account-status" class="muted" role="status"></p>
</section>
<section id="study" style="margin-top:20px">
<nav id="topics" aria-label="Topics"></nav>
<div class="layout">
<article class="panel" aria-labelledby="lesson-title">
<p id="lesson-counter" class="muted"></p>
<h2 id="lesson-title"></h2>
<p id="lesson-body"></p>
<pre><code id="example"></code></pre>
<form id="quiz"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><button type="submit">Check answer</button><p id="feedback" class="feedback" role="status"></p></form>
<div class="actions" style="margin-top:20px"><button id="previous">Previous</button><button id="next" class="primary">Next lesson</button><button id="bookmark" aria-pressed="false">Save lesson</button></div>
</article>
<aside aria-label="Study tools">
<section class="panel"><h3>Topic progress</h3><progress id="progress" aria-label="Topic progress"></progress><p id="progress-label" class="muted"></p><label for="note">Your notes</label><textarea id="note" rows="4" maxlength="4000" placeholder="Write a takeaway…"></textarea><small id="storage-status" role="status">Notes and progress are saved in this browser.</small></section>
<section class="panel"><h3>Study help</h3><p class="muted">Review the current lesson’s explanation or example.</p><div class="actions"><button id="explain">Explain concept</button><button id="show-example">Walk through example</button></div><p id="help-answer" class="feedback" role="status"></p></section>
<section id="chat-panel" class="panel" hidden>
<h3>Ask the AI tutor</h3>
<form id="chat-form">
<label for="chat-question">Question about this lesson</label>
<textarea id="chat-question" required maxlength="1000" rows="3"></textarea>
<button id="ask" type="submit">Ask tutor</button>
</form>
<p id="chat-answer" class="feedback" role="status" style="white-space:pre-wrap"></p>
</section>
</aside>
</div>
</section>
<section id="saved" class="panel" hidden><h2>Saved lessons</h2><div id="saved-list" class="saved-list"></div></section>
</main>
</body>
</html>
